# The gate — plan WP-0.4.
#
# Every check here already exists as something a person is supposed to
# run before committing. The point of the file is that "supposed to" is
# not a control: the checks that get skipped are the ones nobody sees
# skipped, and the day they matter is the day somebody is in a hurry.
#
# The order is deliberate — cheapest refusal first, so a formatting slip
# does not wait five minutes behind the test suite to tell you.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A second push to the same branch makes the first run's answer
  # irrelevant. Cancelling it frees the runner instead of queueing an
  # answer about code nobody has any more.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    # ── এই একটা লাইন না থাকায় CI পাঁচটা রান ধরে কিছুই যাচাই করেনি ──────
    #
    # `.env` রিপোতে থাকে না (থাকার কথাও নয়), আর `config/app.php`-এ লেখা
    # `env('APP_ENV', 'production')` — অর্থাৎ ডিফল্টই **production**।
    #
    # `migrate:fresh` ধ্বংসাত্মক কমান্ড, তাই Laravel প্রোডাকশনে সেটা
    # চালানোর আগে জিজ্ঞেস করে; `--no-interaction`-এ উত্তর দেওয়ার কেউ নেই,
    # তাই সে **বাতিল** করে আর exit 1 দেয়। লগে কোনো ব্যতিক্রম নেই, কেবল
    # "APPLICATION IN PRODUCTION · Command cancelled" — আর ওই দুই লাইন
    # দেখে ভুলটা ধরা কঠিন, কারণ কিছু ভাঙেনি, কিছু চলেইনি।
    #
    # ফল: ৩০ আগস্ট ২০২৬ পর্যন্ত টানা পাঁচটা রান লাল, আর প্রতিটাই থেমেছে
    # **টেস্ট শুরু হওয়ার আগেই**। গেটটা তখন কেবল Pint আর npm build দেখত;
    # ২,১৪৭টা পরীক্ষার একটাও চলেনি। ৩১ আগস্ট ২০২৬-এ ধরা পড়ল।
    #
    # phpunit.xml নিজে `APP_ENV=testing` বসায়, কিন্তু সেটা কেবল টেস্ট
    # প্রসেসের ভিতরে — মাইগ্রেশনের ধাপ আলাদা প্রসেস, সে ওটা দেখে না।
    env:
      APP_ENV: testing

    services:
      mysql:
        # MySQL, not sqlite, and this is not a preference.
        #
        # The number series engine leans on SELECT ... FOR UPDATE so two
        # people cannot take the same invoice number, and sqlite has no
        # row locks at all — the test would pass there and the bug would
        # ship. Same for DECIMAL(18,4), which sqlite stores as a float:
        # the whole "money is never a float" guard would be testing
        # nothing. phpunit.xml says the same thing for the same reasons.
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: abos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, mbstring, pdo_mysql, gd, zip, intl
          coverage: none
        # bcmath is not optional here. Every money figure in the system
        # goes through it, and without the extension the failure is not
        # a missing feature — it is arithmetic that silently falls back
        # to floats.

      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: npm
        run: npm ci

      # ── Cheapest refusal first ──────────────────────────────────────

      - name: Formatting (Pint)
        run: vendor/bin/pint --test

      - name: Build the assets
        # Before the tests, not after: BuiltAssetsAreFreshTest compares
        # the built CSS against every view and style source, so a stale
        # build would fail the suite for a reason that has nothing to do
        # with the code under test.
        run: npm run build

      - name: Migrate from nothing
        # `migrate:fresh`, not `migrate`. A migration that only works
        # against a database that already has the previous shape is a
        # migration that will fail on the first new company, and that is
        # exactly the case nobody tests by hand.
        # --force দ্বিতীয় বেড়া: APP_ENV কোনোদিন আবার হারিয়ে গেলেও
        # কমান্ডটা তখন থেমে না গিয়ে চলবে, আর গেট আসল কাজটা করতে পারবে
        run: php artisan migrate:fresh --seed --force --no-interaction
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: abos_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Tests
        # লাল দেখলে প্রথমেই ধরে নেবেন না বিল্ড ভাঙা।
        #
        # ১২ আগস্ট ২০২৬-এ ৯৫৮টা টেস্টের একটায় MySQL ডেডলক হয়েছিল —
        # DemoSeeder-এর branches ঢোকানোর সময়, আর ওই টেস্টটা একা চালালে
        # ৩৩/৩৩ পাশ করে। কারণ জানা যায়নি, তাই অনুমান করে কোড বদলানো
        # হয়নি (আর্কিটেকচার §১৪.১-এ বিস্তারিত)।
        #
        # এররে "Deadlock found when trying to get lock" থাকলে ওই
        # টেস্টটা একা চালিয়ে দেখুন। দুই-তিনবার হলে তখন এটা আসল সমস্যা।
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: abos_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Migrations run backwards too
        # A `down()` nobody has ever run is not a rollback plan, it is a
        # hope. The one time it is needed is the one time there is no
        # time to find out it was never written.
        # একই কারণে --force — rollback-ও ধ্বংসাত্মক কমান্ড
        run: php artisan migrate:rollback --step=5 --force --no-interaction
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: abos_test
          DB_USERNAME: root
          DB_PASSWORD: ""
