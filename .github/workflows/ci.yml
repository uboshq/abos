# The gate — plan WP-0.4.
#
# Every check here already exists as something a person is supposed to
# run before committing. The point of the file is that "supposed to" is
# not a control: the checks that get skipped are the ones nobody sees
# skipped, and the day they matter is the day somebody is in a hurry.
#
# The order is deliberate — cheapest refusal first, so a formatting slip
# does not wait five minutes behind the test suite to tell you.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A second push to the same branch makes the first run's answer
  # irrelevant. Cancelling it frees the runner instead of queueing an
  # answer about code nobody has any more.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    # ── এই একটা লাইন না থাকায় CI পাঁচটা রান ধরে কিছুই যাচাই করেনি ──────
    #
    # `.env` রিপোতে থাকে না (থাকার কথাও নয়), আর `config/app.php`-এ লেখা
    # `env('APP_ENV', 'production')` — অর্থাৎ ডিফল্টই **production**।
    #
    # `migrate:fresh` ধ্বংসাত্মক কমান্ড, তাই Laravel প্রোডাকশনে সেটা
    # চালানোর আগে জিজ্ঞেস করে; `--no-interaction`-এ উত্তর দেওয়ার কেউ নেই,
    # তাই সে **বাতিল** করে আর exit 1 দেয়। লগে কোনো ব্যতিক্রম নেই, কেবল
    # "APPLICATION IN PRODUCTION · Command cancelled" — আর ওই দুই লাইন
    # দেখে ভুলটা ধরা কঠিন, কারণ কিছু ভাঙেনি, কিছু চলেইনি।
    #
    # ফল: ৩০ আগস্ট ২০২৬ পর্যন্ত টানা পাঁচটা রান লাল, আর প্রতিটাই থেমেছে
    # **টেস্ট শুরু হওয়ার আগেই**। গেটটা তখন কেবল Pint আর npm build দেখত;
    # ২,১৪৭টা পরীক্ষার একটাও চলেনি। ৩১ আগস্ট ২০২৬-এ ধরা পড়ল।
    #
    # phpunit.xml নিজে `APP_ENV=testing` বসায়, কিন্তু সেটা কেবল টেস্ট
    # প্রসেসের ভিতরে — মাইগ্রেশনের ধাপ আলাদা প্রসেস, সে ওটা দেখে না।
    env:
      APP_ENV: testing

      # ── কভারেজ কেবল main-এর push-এ, প্রতিটা PR-এ নয় ─────────────────
      #
      # শর্তটা এখানে একবার লেখা, দুই জায়গায় নয়। নিচে দুইটা ধাপ এটার উপর
      # দাঁড়িয়ে আছে — একটা চলে যখন এটা সত্য, অন্যটা যখন মিথ্যা। শর্তটা
      # দুইবার লিখলে একদিন একটা বদলে অন্যটা পিছিয়ে থাকত, আর তখন হয় কভারেজ
      # কোথাও চলত না, নয়তো দুইবার চলত।
      #
      # ⓘ কেন PR-এ নয়: কভারেজসহ পুরো সুইট চালানো স্পষ্টভাবে ধীর, আর PR-এ
      # যা দরকার তা হলো দ্রুত উত্তর। main-এ যা ঢুকছে তার মাপ নেওয়াই যথেষ্ট।
      COVERAGE_RUN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    services:
      mysql:
        # MySQL, not sqlite, and this is not a preference.
        #
        # The number series engine leans on SELECT ... FOR UPDATE so two
        # people cannot take the same invoice number, and sqlite has no
        # row locks at all — the test would pass there and the bug would
        # ship. Same for DECIMAL(18,4), which sqlite stores as a float:
        # the whole "money is never a float" guard would be testing
        # nothing. phpunit.xml says the same thing for the same reasons.
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: abos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, mbstring, pdo_mysql, gd, zip, intl
          coverage: none
        # bcmath is not optional here. Every money figure in the system
        # goes through it, and without the extension the failure is not
        # a missing feature — it is arithmetic that silently falls back
        # to floats.

      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: নির্ভরতায় জানা ছিদ্র আছে কি না (Composer)
        # ইনস্টলের ঠিক পরেই, কারণ এটাই সবচেয়ে সস্তা প্রত্যাখ্যান — একটা
        # নেটওয়ার্ক কল, কোনো কম্পাইল নেই, কোনো ডাটাবেজ নেই।
        #
        # ── কেন ধাপটা যোগ করতে হলো ───────────────────────────────────
        # ১২ সেপ্টেম্বর ২০২৬-এ `livewire/livewire` সরানো হয়েছে। প্যাকেজটা
        # composer.json-এ বসে ছিল, ব্যবহার **শূন্য** — ০টা কম্পোনেন্ট, ০টা
        # `wire:` অ্যাট্রিবিউট, ০টা `@livewire` — অথচ সে ৯টা রুট নিবন্ধন
        # করত, যার দুইটা লগইন ছাড়াই খোলা POST, একটা ফাইল-আপলোডের।
        #
        # ⚠️ সৎ কথাটা হলো: `composer audit` ঐ প্যাকেজটা ধরত **না** — সে
        # জানা CVE খোঁজে, অব্যবহৃত নির্ভরতা নয়। কিন্তু শিক্ষাটা এক, আর
        # সেটাই এই ধাপের কারণ: নির্ভরতার তালিকার দিকে কেউ নিয়মিত তাকায়
        # না, তাই ওখানে জিনিস **জমে থাকে** — কখনো অব্যবহৃত, কখনো ছিদ্রসহ।
        # অন্তত ছিদ্রগুলোর দিকে তাকানোটা এখন থেকে আর কারো মনে রাখার
        # উপর নির্ভর করে না।
        run: composer audit

      - name: An application key
        # ── কেন এই ধাপটা এতদিন লাগেনি, আর এখন লাগে ──────────────────────
        # `.env` রিপোতে থাকে না, তাই রানারে `APP_KEY` খালি। Laravel-এর
        # এনক্রিপ্টার ওটা ছাড়া দাঁড়ায় না, আর সেশন, কুকি ও ক্যাশ তিনটাই
        # এনক্রিপ্টারের উপর — ফলে প্রায় প্রতিটা ফিচার-টেস্ট
        # `MissingAppKeyException` দিয়ে পড়ে।
        #
        # এতদিন এটা ধরা পড়েনি কারণ **টেস্ট পর্যন্ত পৌঁছানোই যেত না**:
        # তার আগের ধাপ `migrate:fresh` প্রোডাকশন-প্রহরায় আটকে যেত। ওটা
        # সারানোর পর প্রথম রানেই এটা বেরোল — ৯৪১টা ফেল, ১২টা পাশ।
        #
        # একটা লুকানো ভুল সারালে পরেরটা বেরোয়; সেটাই স্বাভাবিক, আর
        # সেটাই প্রমাণ যে গেটটা এখন সত্যিই কিছু দেখছে।
        #
        # ── কেন `.env.example` কপি করা, আর সরাসরি APP_KEY বসানো নয় ─────
        # সরাসরি একটা কী বসালে ধাপটা ছোট হত, কিন্তু তখন `.env.example`
        # কোনোদিন চালিয়ে দেখা হত না। ৩১ আগস্ট ২০২৬ পর্যন্ত ওটা Laravel-এর
        # কারখানার ফাইলই ছিল — sqlite, `APP_NAME=Laravel`, ABOS-এর একটাও
        # ঘর নেই — আর `composer setup` ওটাই কপি করে। কেউ টের পায়নি।
        #
        # এখন গেট প্রতিবার ওটা দিয়েই দাঁড়ায়। ফাইলটা আবার বাসি হলে CI-ই
        # প্রথমে বলবে, নতুন কেউ নয়।
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: npm
        run: npm ci

      - name: নির্ভরতায় জানা ছিদ্র আছে কি না (npm)
        # `--audit-level=high` ইচ্ছাকৃত, উদারতা নয়।
        #
        # npm-এর low/moderate সতর্কতাগুলোর বড় অংশ থাকে dev-only ট্রানজিটিভ
        # নির্ভরতায় — অর্থাৎ build চেইনের ভিতরে, যা ব্যবহারকারীর ব্রাউজারে
        # কখনো পৌঁছায় না। ওগুলোতে গেট লাল করলে প্রায় প্রতিটা PR-এ একটা করে
        # অপ্রাসঙ্গিক লাল আসত।
        #
        # ⚠️ আর যে গেট রোজ অকারণে লাল হয়, দুই সপ্তাহ পর তার লাল রঙের কোনো
        # মানে থাকে না — তখন সত্যিকারের `high`-ও অভ্যাসবশে পাশ কাটানো হয়।
        # সীমাটা তাই গেটের বিশ্বাসযোগ্যতা রক্ষার জন্য, শিথিলতার জন্য নয়।
        run: npm audit --audit-level=high

      # ── Cheapest refusal first ──────────────────────────────────────

      - name: Formatting (Pint)
        run: vendor/bin/pint --test

      - name: টাইপগুলো সত্যি কি না (PHPStan)
        # ── কেন Pint-এর ঠিক পরে ──────────────────────────────────────
        # উপরের নীতিটাই: Pint উত্তর দেয় সেকেন্ডে, PHPStan মিনিটে, আর
        # টেস্ট সুইট তারও পরে। সস্তা প্রত্যাখ্যান আগে।
        #
        # ── কী পাহারা দেয় ────────────────────────────────────────────
        # এই রিপোতে টাইপ শুরু থেকেই লেখা ছিল — প্রতিটা মেথডে, PHPDoc-এ
        # জেনেরিক পর্যন্ত। কিন্তু কেউ ওগুলো যাচাই করত না, আর যে টাইপ কেউ
        # পড়ে না সেটা টাইপ নয়, মন্তব্য। প্রথম রানেই সেটার দাম দেখা গেল:
        # ছয় জায়গায় PHPDoc কোড থেকে সরে গিয়েছিল — একটায় এমন একটা ক্লাসের
        # নাম লেখা ছিল যেটার কোনো অস্তিত্বই নেই।
        #
        # ── ঋণের মাপ ─────────────────────────────────────────────────
        # প্রথম রানে ১,২৮৩টা ত্রুটি (level 5), সবগুলো phpstan-baseline.neon-এ
        # ধরা। তাই এই ধাপ আজ সবুজ — কিন্তু **নতুন** ত্রুটি ঢুকলেই লাল।
        # পুরনো ঋণ থেমে আছে, বাড়ছে না; বিস্তারিত ঐ ফাইলের মাথায়।
        #
        # --memory-limit=1G: PHPStan পুরো কোডগ্রাফ স্মৃতিতে রাখে, আর এই
        # রিপোতে ১০৬টা মডেল ও ৬৮১টা রুট। সীমাটা স্পষ্ট করে বেঁধে দেওয়া
        # হয়েছে যাতে রিপো বাড়তে থাকলে একদিন গেটটা কোনো ত্রুটি না পেয়েও
        # স্মৃতি ফুরিয়ে মরে না যায় — ঐ ব্যর্থতাটা পড়ে বোঝা সবচেয়ে কঠিন।
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: JavaScript-এর পরীক্ষা (vitest)
        # ── কেন এই ধাপটা যোগ করতে হলো ────────────────────────────────
        # দুইটা ফাইলে ২৬টা পরীক্ষা লেখা ছিল, সবগুলো পাশ করত, আর **কেউ
        # চালাত না** — না CI, না কোনো hook, না `composer test`। লেখা
        # হয়েছিল, তারপর ভুলে যাওয়া হয়েছিল।
        #
        # ⓘ পুরোটা চলে ১.৩ সেকেন্ডে। অর্থাৎ এতদিন যে নিশ্চয়তাটা পাওয়া
        # যায়নি, তার দাম ছিল সেকেন্ডের ভগ্নাংশ।
        #
        # build-এর আগে, কারণ এগুলো উৎস-কোডের একক পরীক্ষা — বান্ডিল করা
        # সম্পদের উপর নির্ভর করে না, তাই আগে চালালে উত্তরটাও আগে আসে।
        run: npm test

      - name: Build the assets
        # Before the tests, not after: BuiltAssetsAreFreshTest compares
        # the built CSS against every view and style source, so a stale
        # build would fail the suite for a reason that has nothing to do
        # with the code under test.
        run: npm run build

      - name: The committed build matches the sources
        # ── কেন এই ধাপটা লাগল, ১২ সেপ্টেম্বর ২০২৬ ─────────────────────
        # `public/build` এখন রিপোতে কমিট করা, আর কারণটা `.gitignore`-এ
        # লেখা: ABOS শেয়ার্ড cPanel হোস্টিংয়েও বসে, আর ওখানে Node নেই।
        # বিল্ড কমিট না করলে `git clone` + `composer install`-এর পর
        # সার্ভারে কোনো CSS বা JS থাকত না — সাইট খুলত, সাজসজ্জাহীন খালি
        # HTML হয়ে, আর কোনো ভুলবার্তা ছাড়াই।
        #
        # ⚠️ কিন্তু কমিট করা বিল্ডের একটা দাম আছে: `resources/js` বা
        # `resources/css` বদলে কেউ `npm run build` চালাতে ভুললে সার্ভারে
        # **পুরনো বান্ডল চলতে থাকবে** — নীরবে। পর্দা খুলবে, স্টাইলও
        # থাকবে, কেবল নতুন কাজটা থাকবে না, আর ডিবাগ করা কঠিন কারণ
        # কোথাও কিছু ভাঙে না।
        #
        # ⭐ এই ধাপটা সেই দায়টা যন্ত্রের হাতে দেয়: উপরের ধাপ এইমাত্র
        # সোর্স থেকে নতুন বিল্ড বানিয়েছে; এখন সেটা কমিট করা বিল্ডের
        # সাথে মেলানো হয়। আলাদা হলে মানে কেউ ভুলেছে, আর গেট থামে।
        #
        # ⓘ Vite-এর ফাইলের নামে কনটেন্ট-হ্যাশ থাকে, তাই একই সোর্স =
        # একই নাম ও একই বাইট। অর্থাৎ তুলনাটা নির্ভরযোগ্য, আর diff
        # থাকা মানে সত্যিই সোর্স আর বিল্ড আলাদা।
        run: |
          if ! git diff --exit-code -- public/build; then
            echo "::error::public/build কমিট করা সংস্করণ সোর্সের সাথে মেলে না।"
            echo "নিজের মেশিনে চালান:  npm run build && git add public/build"
            echo "নাহলে সার্ভারে পুরনো CSS/JS চলতে থাকবে — নীরবে।"
            exit 1
          fi

      - name: Migrate from nothing
        # `migrate:fresh`, not `migrate`. A migration that only works
        # against a database that already has the previous shape is a
        # migration that will fail on the first new company, and that is
        # exactly the case nobody tests by hand.
        # --force দ্বিতীয় বেড়া: APP_ENV কোনোদিন আবার হারিয়ে গেলেও
        # কমান্ডটা তখন থেমে না গিয়ে চলবে, আর গেট আসল কাজটা করতে পারবে
        run: php artisan migrate:fresh --seed --force --no-interaction
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: abos_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Tests
        # শর্তটা কভারেজের কারণে: main-এর push-এ নিচের ধাপটা এই একই সুইট
        # কভারেজসহ চালায়, তাই সেখানে এটা চালালে পুরো সুইট দুইবার চলত।
        # দুইটা ধাপ পরস্পরের বিকল্প — সুইট সবসময় চলে, ঠিক একবার।
        if: env.COVERAGE_RUN != 'true'
        # লাল দেখলে প্রথমেই ধরে নেবেন না বিল্ড ভাঙা।
        #
        # ১২ আগস্ট ২০২৬-এ ৯৫৮টা টেস্টের একটায় MySQL ডেডলক হয়েছিল —
        # DemoSeeder-এর branches ঢোকানোর সময়, আর ওই টেস্টটা একা চালালে
        # ৩৩/৩৩ পাশ করে। কারণ জানা যায়নি, তাই অনুমান করে কোড বদলানো
        # হয়নি (আর্কিটেকচার §১৪.১-এ বিস্তারিত)।
        #
        # এররে "Deadlock found when trying to get lock" থাকলে ওই
        # টেস্টটা একা চালিয়ে দেখুন। দুই-তিনবার হলে তখন এটা আসল সমস্যা।
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: abos_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: কভারেজের জন্য pcov
        if: env.COVERAGE_RUN == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, mbstring, pdo_mysql, gd, zip, intl
          coverage: pcov
        # ── xdebug নয়, pcov ──────────────────────────────────────────
        # দুইটাই কভারেজ দিতে পারে, কিন্তু xdebug একটা পূর্ণ ডিবাগার — সে
        # প্রতিটা ফাংশন কলে হুক বসায়, আর তাতে সুইট কয়েক গুণ ধীর হয়। pcov
        # কেবল কোন লাইন চলল তা গোনে, অর্থাৎ ঠিক যেটুকু এখানে দরকার।
        #
        # ── কেন আলাদা ধাপে, উপরের PHP ধাপে নয় ────────────────────────
        # উপরে `coverage: none`, আর সেটা ইচ্ছাকৃত: কভারেজ ড্রাইভার চালু
        # থাকলে সে সংগ্রহ না করলেও কিছুটা ওজন বয়ে বেড়ায়। PR-এ কভারেজ
        # লাগে না, তাই PR-এর রানগুলো আজকের মতোই হালকা থাকুক — pcov কেবল
        # তখনই বসে যখন তাকে সত্যিই কাজে লাগানো হবে।

      - name: পরীক্ষা ও কভারেজ
        if: env.COVERAGE_RUN == 'true'
        # ── `--min=70` সম্পর্কে একটা সৎ সতর্কতা ───────────────────────
        # সংখ্যাটা পরিকল্পনার লক্ষ্য (ধাপ ১.৪), **মাপা ফল নয়**। এটা যেদিন
        # বসানো হয় সেদিন প্রকৃত কভারেজ কত ছিল তা জানা যায়নি — যে মেশিনে
        # কাজটা হয়েছে সেখানে pcov বা xdebug কোনোটাই ছিল না, তাই স্থানীয়ভাবে
        # মাপার উপায় ছিল না।
        #
        # ⚠️ তাই main-এ প্রথম push-টাই আসল উত্তরটা দেবে। লাল হলে সেটা
        # কোডের অবনতি নয় — প্রথমবার সত্যিটা জানা। তখন দুইটা পথ: হয়
        # পরীক্ষা যোগ করা, নয়তো সংখ্যাটা আজকের বাস্তব মানে নামিয়ে এনে
        # ধাপে ধাপে ওঠানো। ⛔ যেটা করবেন না: ধাপটা মুছে ফেলা।
        #
        # ⓘ `--min` ছাড়া `--coverage` কেবল একটা সংখ্যা ছাপে, আর ছাপা
        # সংখ্যা কাউকে কিছু করতে বাধ্য করে না। সীমাটাই ধাপটাকে গেট বানায়।
        run: php artisan test --coverage --min=70
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: abos_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Migrations run backwards too
        # A `down()` nobody has ever run is not a rollback plan, it is a
        # hope. The one time it is needed is the one time there is no
        # time to find out it was never written.
        # একই কারণে --force — rollback-ও ধ্বংসাত্মক কমান্ড
        run: php artisan migrate:rollback --step=5 --force --no-interaction
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: abos_test
          DB_USERNAME: root
          DB_PASSWORD: ""
