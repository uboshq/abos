name: abos_mobile
description: >
  ABOS Mobile — the offline-first client. This directory currently holds the
  synchronisation core and nothing else: no screens, no business features.
  Those are the mobile team's work; this is the machinery underneath them.
publish_to: "none"

# Starts at 0.1.0 with an explicit +1 versionCode. The +N is not decoration:
# without it Flutter defaults every build to versionCode 1, and the Android
# package installer refuses an "upgrade" whose versionCode is not greater --
# which is exactly the path a phone in a shop takes in the morning. A plain
# counter that only ever goes up, never derived from the version name.
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP, with an interceptor chain -- the access-token attach and the
  # single-flight refresh in core/api_client both need one.
  dio: ^5.5.0

  # The offline queue and the reference cache. Hive rather than sqflite for
  # these two: both are key/value by nature (a queued change by its own id, a
  # cached record by "$entityType:$entityId"), and neither is ever queried by
  # anything but its key. A relational store here would be a schema to migrate
  # for no question it can answer that this cannot.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # What makes the queue drain by itself. Without this, a rep who walked back
  # into coverage would still have to open the app and press something.
  connectivity_plus: ^6.0.5

  # Tokens, the device id and the Hive encryption key live in the platform
  # keystore (Android EncryptedSharedPreferences / iOS Keychain) -- never in
  # Hive or SharedPreferences, which are plain files inside the app sandbox
  # and are read in clear text on a rooted device or out of a backup.
  flutter_secure_storage: ^9.2.2

  # Drains the queue while the app is closed. Android's WorkManager refuses
  # any periodic task under 15 minutes, so 15 is the floor the platform
  # allows, not a cadence anybody chose.
  workmanager: ^0.10.0

  # State management for the screens layer (main.dart, routing, every
  # feature) — free/BSD, no account or API key. Matches the sibling Nexus
  # mobile app's own choice, so one person can move between the two Flutter
  # codebases without relearning a second pattern for the same job.
  flutter_riverpod: ^2.5.1

  # Declarative routing with an auth redirect guard (signed-out -> /login,
  # signed-in -> the role's home) — free/MIT.
  go_router: ^14.2.0

  # Date formatting for the sync-status screen's "last synced" times —
  # free/BSD, the official Dart team package.
  intl: ^0.19.0

  # ── ছাপা ও পাঠানো ─────────────────────────────────────────────────────
  # কাগজটা সার্ভার বানায় (app/Core/Engines/Print — mPDF, আর A4/৮০mm/৫৮mm
  # তিনটা মাপই ওখানে আছে)। ফোন কেবল বাইটগুলো নেয় আর বিলি করে। লোগো, ভ্যাট,
  # কথায়-টাকা, শর্তাবলী ফোনে আবার লিখলে একদিন ওয়েবের চালান আর ফোনের চালান
  # দুই অঙ্ক দেখাত, আর ছাপা কাগজে সেটা ধরা পড়ত সবার শেষে।

  # Android-এর নিজের প্রিন্ট ব্যবস্থায় PDF পাঠায় — WiFi, USB, নেটওয়ার্ক,
  # যেকোনো প্রিন্ট-সার্ভিসওয়ালা যন্ত্র। সাথে PDF-কে ছবিতে রূপান্তরও করে
  # (Printing.raster), যেটা থার্মাল প্রিন্টারের জন্য দরকার হয়। Apache-2.0।
  printing: ^5.13.0

  # WhatsApp/ইমেইল/ড্রাইভ — যেখানে খুশি পাঠানো। BSD।
  #
  # ⚠️ ১৩ সেপ্টেম্বরের বিল্ডে সতর্কবার্তা: share_plus আর workmanager_android
  # দুইটাই Kotlin Gradle Plugin প্রয়োগ করে, আর ভবিষ্যতের Flutter ওতে বিল্ড
  # ফেল করাবে ("Built-in Kotlin")। আজ কেবল সতর্কবার্তা, বিল্ড হয়। Flutter
  # আপগ্রেড করার দিন প্রথমে এই দুইটার নতুন সংস্করণ দেখতে হবে — নাহলে কারণটা
  # খুঁজতে সময় যাবে, কারণ বার্তাটা তখন আর থাকবে না, সরাসরি ব্যর্থতা আসবে।
  share_plus: ^10.0.2

  # নামানো ফাইলটা রাখার জায়গা। BSD।
  path_provider: ^2.1.4

  # আপডেটের লিংক ব্রাউজারে খোলার জন্য — docs/Contract §৬ নিয়ম খ: অ্যাপ নিজে
  # APK নামায় না, কেবল ঠিকানাটা ব্রাউজারকে দেয়। BSD।
  url_launcher: ^6.3.0

  # ── Bluetooth থার্মাল রসিদ প্রিন্টার ──────────────────────────────────
  # দোকানের সস্তা ৫৮/৮০mm প্রিন্টারগুলো Android-এর প্রিন্ট ব্যবস্থায় ধরা
  # দেয় না — ওরা Bluetooth-এ ESC/POS বাইট নেয়। তাই আলাদা পথ, কিন্তু
  # ⭐ একই কাগজ: সার্ভারের ৫৮mm PDF-টাই ফোনে ছবি করে পাঠানো হয়, নতুন করে
  # সাজানো হয় না। দুইটা পথ, একটা বিন্যাস।
  # PDF-এর পাতাকে ছবি হিসেবে ধরার জন্য — printing-এর raster() যে ধরনটা
  # ফেরত দেয়, আর esc_pos যে ধরনটা চায়, দুইটাই এই প্যাকেজের। MIT।
  image: ^4.2.0

  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
